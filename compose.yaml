name: fiap-cloud-games

x-broker: &broker
  RabbitMq__Host: rabbitmq
  RabbitMq__Port: 5672
  RabbitMq__VirtualHost: fcg
  RabbitMq__Username: fcg_local
  RabbitMq__Password: ${RABBITMQ_PASSWORD:?Configure .env}

x-dependencies: &dependencies
  postgres:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy

services:
  postgres:
    image: postgres:17-bookworm@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
    environment:
      POSTGRES_USER: fcg_admin
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Execute scripts/Initialize-Local.ps1}
      USERS_DB_PASSWORD: ${USERS_DB_PASSWORD:?Senha Users ausente}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?Senha Catalog ausente}
      PAYMENTS_DB_PASSWORD: ${PAYMENTS_DB_PASSWORD:?Senha Payments ausente}
      NOTIFICATIONS_DB_PASSWORD: ${NOTIFICATIONS_DB_PASSWORD:?Senha Notifications ausente}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-services.sh:/docker-entrypoint-initdb.d/10-services.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U fcg_admin -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.2.9-management@sha256:d1fb8b38bd0805935907a22b2b7483fba38c9a8dd7e8a74bfba4a6e7a9e91707
    hostname: fcg-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: fcg_local
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Execute scripts/Initialize-Local.ps1}
      RABBITMQ_DEFAULT_VHOST: fcg
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: [CMD, gosu, rabbitmq, rabbitmq-diagnostics, -q, check_running]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  users:
    image: fiap-cloud-games-users:local
    build: ../fiap-cloud-games-users
    environment:
      <<: *broker
      ConnectionStrings__Users: Host=postgres;Port=5432;Database=fcg_users;Username=fcg_users;Password=${USERS_DB_PASSWORD:?Configure .env}
      Jwt__Key: ${JWT_KEY:?Execute scripts/Initialize-Local.ps1}
      Jwt__Issuer: ${JWT_ISSUER:-fiap-cloud-games-users}
      Jwt__Audience: ${JWT_AUDIENCE:-fiap-cloud-games}
      Jwt__ExpirationMinutes: 60
      AdminBootstrap__Name: ${BOOTSTRAP_NAME:-Administrador local}
      AdminBootstrap__Email: ${BOOTSTRAP_EMAIL:?Configure .env}
      AdminBootstrap__Password: ${BOOTSTRAP_PASSWORD:?Configure .env}
    ports: ["127.0.0.1:${USERS_PORT:-5081}:8080"]
    depends_on: *dependencies
    restart: unless-stopped

  catalog:
    image: fiap-cloud-games-catalog:local
    build: ../fiap-cloud-games-catalog
    environment:
      <<: *broker
      ConnectionStrings__Catalog: Host=postgres;Port=5432;Database=fcg_catalog;Username=fcg_catalog;Password=${CATALOG_DB_PASSWORD:?Configure .env}
      Jwt__Key: ${JWT_KEY:?Configure .env}
      Jwt__Issuer: ${JWT_ISSUER:-fiap-cloud-games-users}
      Jwt__Audience: ${JWT_AUDIENCE:-fiap-cloud-games}
    ports: ["127.0.0.1:${CATALOG_PORT:-5082}:8080"]
    depends_on: *dependencies
    restart: unless-stopped

  payments:
    image: fiap-cloud-games-payments:local
    build: ../fiap-cloud-games-payments
    environment:
      <<: *broker
      ConnectionStrings__Payments: Host=postgres;Port=5432;Database=fcg_payments;Username=fcg_payments;Password=${PAYMENTS_DB_PASSWORD:?Configure .env}
      PaymentSimulation__Outcome: ${PAYMENT_OUTCOME:-Approved}
    ports: ["127.0.0.1:${PAYMENTS_PORT:-5083}:8080"]
    depends_on: *dependencies
    restart: unless-stopped

  notifications:
    image: fiap-cloud-games-notifications:local
    build: ../fiap-cloud-games-notifications
    environment:
      <<: *broker
      ConnectionStrings__Notifications: Host=postgres;Port=5432;Database=fcg_notifications;Username=fcg_notifications;Password=${NOTIFICATIONS_DB_PASSWORD:?Configure .env}
    ports: ["127.0.0.1:${NOTIFICATIONS_PORT:-5084}:8080"]
    depends_on: *dependencies
    restart: unless-stopped

volumes:
  postgres-data:
  rabbitmq-data:
